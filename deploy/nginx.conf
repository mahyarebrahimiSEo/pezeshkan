# ==============================================================================
# پیکربندی امنیتی Nginx برای استقرار اکوسیستم پزشکآن روی سرور (Ubuntu / Debian VPS)
# ==============================================================================

# ۱. محدودیت نرخ درخواست‌ها جهت مقابله با حملات Brute Force و DoS
limit_req_zone $binary_remote_addr zone=pezeshkan_api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pezeshkan_login_limit:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=pezeshkan_conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # انتقال خودکار به پروتکل امن HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # گواهی‌نامه SSL/TLS (مثلاً Let's Encrypt یا کلودفلر)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # پروتکل‌ها و سایفرهای مدرن امن
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # محدودیت تعداد اتصالات همزمان از یک IP
    limit_conn pezeshkan_conn_limit 20;

    # حداکثر حجم مجاز درخواست (مطابق با MAX_PAYLOAD_SIZE در سرور پایتون جهت تصاویر بالینی HD)
    client_max_body_size 15M;

    # تایم‌اوت‌های سخت‌گیرانه برای مقابله با حملات Slowloris
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # فعال‌سازی فشرده‌سازی Gzip جهت ارتقای Core Web Vitals و سرعت سئو (LCP / FCP)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/manifest+json
        image/svg+xml;

    # انسداد کامل دسترسی به فایل‌های مخفی و دات‌فایل‌ها (.env, .git و ...)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # انسداد دسترسی مستقیم به سورس کدهای سرور و اسناد داخلی
    location ~* \.(py|pyc|bat|sh|env|md|docx|odt|zip|tar|gz|bak|log|sqlite|db)$ {
        deny all;
        access_log off;
    }

    # محدودیت سخت‌گیرانه برای درگاه لاگین (ضد حمله دیکشنری و کرک پسورد)
    location /api/login {
        limit_req zone=pezeshkan_login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # محدودیت برای فرم‌های ثبت لید و تماس
    location ~ ^/api/(start-lead|contact) {
        limit_req zone=pezeshkan_api_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # مسیر مستقیم و بهینه فایل‌های سئو موتورهای جستجو
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000/robots.txt;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000/sitemap.xml;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ۱. فونت‌های وزیرمتن (حداکثر کش ۱ سال به صورت نامتغیر)
    location ~* \.(woff2|woff|ttf)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ۲. تصاویر و آیکون‌های وکتور و رسانه‌های آپلودی
    location ~* \.(svg|png|jpg|jpeg|webp|gif|ico|webmanifest)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # ۳. اسکریپت‌ها و استایل‌ها با اعتبارسنجی مجدد (جلوگیری از ناسازگاری آپدیت‌های جدید)
    location ~* \.(css|js)$ {
        proxy_pass http://127.0.0.1:3000;
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # پروکسی معکوس سراسری به سمت اپلیکیشن پایتون
    location / {
        limit_req zone=pezeshkan_api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
