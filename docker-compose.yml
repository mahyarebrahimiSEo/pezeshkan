version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pezeshkan_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./mag/uploads:/app/mag/uploads
    networks:
      - pezeshkan_network

  db:
    image: postgres:16-alpine
    container_name: pezeshkan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pezeshkan_db}
      POSTGRES_USER: ${POSTGRES_USER:-pezeshkan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pezeshkan_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pezeshkan_user} -d ${POSTGRES_DB:-pezeshkan_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pezeshkan_network

volumes:
  postgres_data:
    driver: local

networks:
  pezeshkan_network:
    driver: bridge
