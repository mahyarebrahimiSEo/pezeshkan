<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" fill="none">
  <defs>
    <linearGradient id="pzk-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="pzk-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="pzk-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="pzk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Power Arc (Doctor Shoulders / Power Ring) -->
  <path d="M 72 78 A 68 68 0 1 0 168 78" stroke="url(#pzk-metal)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 72 78 A 68 68 0 1 0 168 78" stroke="url(#pzk-cyan)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

  <!-- Doctor Head & Cap -->
  <circle cx="120" cy="56" r="22" fill="url(#pzk-metal)"/>
  <path d="M 98 44 Q 120 26 142 44 L 138 52 Q 120 42 102 52 Z" fill="#1E293B" stroke="url(#pzk-metal)" stroke-width="2"/>
  
  <!-- Glowing Green Medical Cross on Cap -->
  <g filter="url(#pzk-glow)">
    <rect x="117" y="31" width="6" height="16" rx="1.5" fill="url(#pzk-green)"/>
    <rect x="112" y="36" width="16" height="6" rx="1.5" fill="url(#pzk-green)"/>
  </g>

  <!-- Central Power Bar / Medical Coat Collar V-Neck -->
  <path d="M 106 84 L 120 108 L 134 84 L 130 148 C 130 153 110 153 110 148 Z" fill="url(#pzk-metal)"/>
  <rect x="116" y="88" width="8" height="58" rx="4" fill="url(#pzk-green)" filter="url(#pzk-glow)"/>

  <!-- Wordmark: PEZESHK-ON -->
  <text x="120" y="232" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="26" letter-spacing="2" fill="currentColor">
    PEZESHK-<tspan fill="#10B981">O</tspan>N
  </text>
</svg>
