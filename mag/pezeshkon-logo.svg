<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Master Clinical Gradients (2026 Liquid Glass) -->
    <linearGradient id="pzk-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="30%" stop-color="#0066FF"/>
      <stop offset="70%" stop-color="#0047BA"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="pzk-cyan-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="60%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="pzk-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="pzk-head-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="pzk-cap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0047BA"/>
    </linearGradient>
    <linearGradient id="pzk-coat-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="pzk-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- 1. Outer Power Ring & Stethoscope Loop (The 'ON' in Pezeshk-ON) -->
  <!-- Continuous unbroken arc sweeping from (33, 38) around to (87, 38) -->
  <path d="M 33 38 A 38 38 0 1 0 87 38" 
        stroke="url(#pzk-ring-grad)" 
        stroke-width="9" 
        stroke-linecap="round"/>

  <!-- Specular Liquid Glass Top Rim Highlight -->
  <path d="M 33 38 A 38 38 0 0 0 60 102" 
        stroke="url(#pzk-specular)" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        opacity="0.8"/>

  <!-- High-Precision Concentric Cyan Pulse Line -->
  <path d="M 35.5 41 A 34.5 34.5 0 1 0 84.5 41" 
        stroke="url(#pzk-cyan-pulse)" 
        stroke-width="1.8" 
        stroke-linecap="round" 
        opacity="0.95"/>

  <!-- Stethoscope / Power Terminal Earpieces (Rounded Nodes at Terminals) -->
  <circle cx="33" cy="38" r="4.5" fill="#00E5FF"/>
  <circle cx="33" cy="38" r="2.2" fill="#FFFFFF"/>
  <circle cx="87" cy="38" r="4.5" fill="#10B981"/>
  <circle cx="87" cy="38" r="2.2" fill="#FFFFFF"/>

  <!-- 2. Doctor Silhouette Core: Head & Cap -->
  <!-- Head Sphere -->
  <circle cx="60" cy="31" r="12" fill="url(#pzk-head-grad)"/>

  <!-- Clinical Cap in Medical Cobalt with Specular Rim (Always visible in Dark & Light) -->
  <path d="M 49.5 28 C 53 21 67 21 70.5 28 L 68 31.5 C 65.5 27 54.5 27 52 31.5 Z" 
        fill="url(#pzk-cap-grad)" 
        stroke="#FFFFFF" 
        stroke-width="0.8" 
        stroke-opacity="0.6"/>

  <!-- 3. Crisp Medical Cross (Ultra-sharp, Emerald Vitality) -->
  <rect x="58.2" y="14" width="3.6" height="11" rx="1.8" fill="url(#pzk-emerald)"/>
  <rect x="54.5" y="17.7" width="11" height="3.6" rx="1.8" fill="url(#pzk-emerald)"/>
  <circle cx="60" cy="19.5" r="1.2" fill="#FFFFFF"/>

  <!-- 4. Clinical Coat V-Neck & Vital Pulse Tie -->
  <!-- Dignified Symmetrical Coat Shoulders & Lapels -->
  <path d="M 49 46 L 60 58 L 71 46 L 66 84 C 66 87.5 54 87.5 54 84 Z" 
        fill="url(#pzk-coat-grad)" 
        stroke="#CBD5E1" 
        stroke-width="0.8"/>
  <path d="M 52 48 L 60 57 L 68 48" 
        stroke="#94A3B8" 
        stroke-width="1.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Vital Emerald Power Core / Lifeline Tie -->
  <rect x="58.2" y="50" width="3.6" height="30" rx="1.8" fill="url(#pzk-emerald)"/>
  <circle cx="60" cy="81" r="3" fill="#10B981"/>
  <circle cx="60" cy="81" r="1.2" fill="#FFFFFF"/>
</svg>